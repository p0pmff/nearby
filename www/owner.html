<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Nearby owner panel</title>
<style>
:root{color-scheme:dark;--bg:#0b0e18;--card:#141a2b;--line:#252d44;--text:#eef1ff;--muted:#9aa4c4;--accent:#3b82f6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:22px;margin:0}
h2{font-size:16px;margin:28px 0 12px}
small{color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,a.btn{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
button.ghost,a.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
button.red{background:#ef4444}
button.on{background:var(--accent);border-color:transparent}
input,textarea,select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:10px 12px;font:inherit;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.card b{display:block;font-size:26px;margin-top:4px}
.box{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;text-align:center;gap:12px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:16px;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:860px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:12px}
tr:last-child td{border-bottom:0}
.act{white-space:nowrap}
.act button{padding:6px 10px;font-size:12px;margin-right:6px}
.tag{padding:3px 8px;border-radius:10px;font-size:11px;font-weight:700;background:var(--line)}
.tag.ok{background:rgba(61,220,151,.18);color:#3ddc97}
.tag.bad{background:rgba(239,68,68,.2);color:#ff7b7b}
.f{display:grid;gap:10px;max-width:520px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .card{width:100%;max-width:420px}
.modal h2{margin-top:0}
</style>
</head>
<body>
<div class="wrap">
<div class="box" id="lg" hidden><h1>Nearby owner panel</h1><small>Sign in with the owner account</small><button id="gin">Continue with Google</button></div>
<div class="box" id="dn" hidden><h1>Not authorized</h1><small id="who"></small><div class="row"><a class="btn ghost" href="./">Back to the app</a><button class="ghost" data-a="out">Sign out</button></div></div>
<div id="ow" hidden>
<header><div><h1>Owner panel</h1><small id="em"></small></div><div class="row"><small id="status"></small><button class="ghost" data-a="refresh">Refresh</button><a class="btn ghost" href="./">Back to the app</a><button class="ghost" data-a="out">Sign out</button></div></header>
<div class="grid" id="stats"></div>
<h2>Accounts <small id="count"></small></h2>
<div class="row"><div style="flex:1;min-width:220px"><input id="q" placeholder="Search name, username, email or ID" autocomplete="off"></div><button class="ghost on" data-a="flt" data-v="all">All</button><button class="ghost" data-a="flt" data-v="active">Active</button><button class="ghost" data-a="flt" data-v="banned">Banned</button></div>
<div class="scroll"><table><thead><tr><th>Account</th><th>Registered</th><th>Last opened</th><th>Last seen</th><th>Friends</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
<h2>Broadcast a notification</h2>
<div class="f"><input id="bt" maxlength="60" placeholder="Title"><textarea id="bb" rows="3" maxlength="200" placeholder="Message"></textarea><div class="row"><button data-a="bc">Send to everyone</button><small id="bs"></small></div></div>
</div>
</div>
<div class="modal" id="bm" hidden><div class="card"><h2 id="bmt">Ban account</h2><div class="f"><input id="br" maxlength="200" placeholder="Reason (shown to the user)"><select id="bd"><option value="3600000">1 hour</option><option value="21600000">6 hours</option><option value="86400000">1 day</option><option value="604800000">7 days</option><option value="2592000000">30 days</option><option value="custom">Custom date and time</option><option value="perm">Permanent</option></select><input type="datetime-local" id="bc" hidden><small id="be" style="color:#ff7b7b"></small><div class="row"><button class="red" data-a="banok">Ban</button><button class="ghost" data-a="bancancel">Cancel</button></div></div></div></div>
<script src="supabase-config.js"></script>
<script type="module" src="owner.js"></script>
</body>
</html>
